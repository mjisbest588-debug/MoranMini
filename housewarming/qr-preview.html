<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>MoranMini HOUSE QR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f5f0e6;
      --ink: #4a3f35;
      --accent: #c9a87c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #e8dfd0;
      color: var(--ink);
      font-family: "Jua", sans-serif;
      overflow-x: hidden;
    }
    .card {
      width: min(100%, 360px);
      padding: 28px 22px;
      border-radius: 24px;
      background: var(--paper);
      text-align: center;
      box-shadow: 0 10px 28px rgba(74, 63, 53, 0.12);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
      font-weight: 400;
    }
    p {
      margin: 0 0 18px;
      line-height: 1.5;
      color: #6b5d50;
    }
    img {
      width: min(72vw, 240px);
      height: auto;
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(74, 63, 53, 0.12);
    }
    a {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 22px;
      border-radius: 999px;
      background: linear-gradient(180deg, #d4b896, #b8956e);
      color: #fff;
      text-decoration: none;
    }
    code {
      display: block;
      margin-top: 12px;
      font-size: 0.9rem;
      color: var(--accent);
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>MoranMini HOUSE QR</h1>
    <p>모바일에서 스캔하면 초대장으로 이동해요.</p>
    <img src="static/images/qr-moranmini-house.png" alt="MoranMini HOUSE QR 코드">
    <a href="/housewarming/">초대장 열기</a>
    <code>/m → /housewarming/</code>
  </div>
</body>
</html>
